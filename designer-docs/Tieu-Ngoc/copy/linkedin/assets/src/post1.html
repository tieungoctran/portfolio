<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=1.0">
  <title>LinkedIn Post 1 - Manifesto</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=DM+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 1200px;
      height: 1200px;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background-color: #FDFBF7;
      color: #0d0d0d;
    }
    
    /* Dot grid background */
    .canvas {
      position: relative;
      width: 1200px;
      height: 1200px;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #FDFBF7;
      background-image: radial-gradient(#0d0d0d 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      border: 16px solid #0d0d0d;
    }
    
    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    
    .tag {
      background-color: #FF6B35;
      color: #FDFBF7;
      padding: 12px 24px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
      border: 4px solid #0d0d0d;
      box-shadow: 4px 4px 0px #0d0d0d;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .brand-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -1px;
      background: #0d0d0d;
      color: #FDFBF7;
      padding: 8px 18px;
      border: 4px solid #0d0d0d;
      box-shadow: 4px 4px 0px #FF6B35;
    }

    /* Main Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 500px 1fr;
      gap: 40px;
      align-items: center;
      margin-top: 20px;
      margin-bottom: 20px;
      height: 800px;
    }
    
    /* Left Column: Portrait & Name Card */
    .left-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .portrait-frame {
      position: relative;
      width: 420px;
      height: 520px;
      background-color: #4ECDC4;
      border: 6px solid #0d0d0d;
      box-shadow: 12px 12px 0px #0d0d0d;
      overflow: hidden;
      margin-bottom: 30px;
    }
    
    .portrait-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .profile-card {
      width: 420px;
      background-color: #fff;
      border: 5px solid #0d0d0d;
      padding: 15px;
      box-shadow: 6px 6px 0px #0d0d0d;
      text-align: center;
    }
    
    .profile-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    
    .profile-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #FF6B35;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* Right Column: Large Quote */
    .right-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
    }
    
    .quote-box {
      background-color: #fff;
      border: 6px solid #0d0d0d;
      padding: 50px 40px;
      box-shadow: 12px 12px 0px #0d0d0d;
      position: relative;
      margin-bottom: 30px;
    }
    
    .quote-mark {
      position: absolute;
      top: -30px;
      left: 30px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 100px;
      font-weight: 700;
      line-height: 1;
      color: #FF6B35;
      background: #FDFBF7;
      padding: 0 10px;
      border: 4px solid #0d0d0d;
      border-radius: 10px;
    }
    
    .quote-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 44px;
      font-weight: 700;
      line-height: 1.25;
      color: #0d0d0d;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    
    .highlight-text {
      color: #FF6B35;
      position: relative;
      display: inline-block;
    }
    
    .highlight-text::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 0;
      width: 100%;
      height: 8px;
      background-color: #4ECDC4;
      z-index: -1;
    }
    
    .annotated-badge {
      align-self: flex-start;
      background-color: #7BC950;
      color: #0d0d0d;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 24px;
      padding: 12px 24px;
      border: 4px solid #0d0d0d;
      box-shadow: 6px 6px 0px #0d0d0d;
      transform: rotate(-2deg);
      margin-left: 20px;
    }
    
    /* Footer */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-top: 4px solid #0d0d0d;
      padding-top: 25px;
    }
    
    .footer-left {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
    }
    
    .footer-right {
      display: flex;
      gap: 30px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #666;
    }
    
    .footer-link {
      color: #0d0d0d;
      text-decoration: none;
      position: relative;
    }
    
    .footer-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: #FF6B35;
    }

    /* Wobbly SVG Filter */
    .wobbly {
      filter: url(#wobbly-border);
    }
  </style>
</head>
<body>
  
  <!-- Wobbly SVG Filter Definition -->
  <svg style="position: absolute; width: 0; height: 0;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="wobbly-border">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="canvas">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="tag wobbly">Manifesto #01</div>
      <div class="brand-logo">TIEUNGOC.SITE</div>
    </div>
    
    <!-- Main Content Grid -->
    <div class="main-grid">
      <!-- Portrait Card -->
      <div class="left-col">
        <div class="portrait-frame wobbly">
          <!-- We use portrait.png copied to assets directory -->
          <img class="portrait-img" src="../portrait.png" alt="Trần Tiểu Ngọc">
        </div>
        <div class="profile-card wobbly">
          <div class="profile-name">Trần Tiểu Ngọc</div>
          <div class="profile-title">E-Commerce CRO Designer</div>
        </div>
      </div>
      
      <!-- Quote Box -->
      <div class="right-col">
        <div class="quote-box wobbly">
          <div class="quote-mark wobbly">“</div>
          <div class="quote-text">
            Thiết kế <span class="highlight-text">đẹp mắt</span> thôi chưa đủ, thiết kế phải <span class="highlight-text">chuyển đổi</span> (CRO).
          </div>
        </div>
        <div class="annotated-badge wobbly">CTR & CONVERSION FIRST! 🎯</div>
      </div>
    </div>
    
    <!-- Footer Bar -->
    <div class="footer-bar">
      <div class="footer-left">💼 Portfolio: tieungoc.site</div>
      <div class="footer-right">
        <span>#EcomDesign</span>
        <span>#CROFirst</span>
      </div>
    </div>
  </div>

</body>
</html>
