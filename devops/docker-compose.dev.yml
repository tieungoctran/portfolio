version: '3.8'

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: tn_frontend_dev
    ports:
      - "3000:3000"
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    networks:
      - app-dev-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tn_backend_dev
    ports:
      - "5000:5000"
    command: npm run dev
    volumes:
      - ../backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - CORS_ORIGIN=http://localhost:3000
    networks:
      - app-dev-network

networks:
  app-dev-network:
    driver: bridge
