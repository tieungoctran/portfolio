$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Tieu-Ngoc Docs
  structure:
    - type: section
      key: section-1
      title: Giới thiệu Tiểu Ngọc
      path: tieu-ngoc-docs
      description: Trần Tiểu Ngọc — công việc thiết kế, kinh nghiệm và thông tin kết nối.
      icon: user
      default: true
      children:
        - type: space
          key: space-1
          title: Giới thiệu Tiểu Ngọc
          path: tran-tieu-ngoc-design-and-ai-notebook
          default: true
          content:
            directory: ./tieu-ngoc-docs/tran-tieu-ngoc-design-and-ai-notebook
            language: vi
    - type: section
      key: section-2
      title: Sổ tay của Ngọc
      path: product-docs
      description: "Design & AI Notebook: nhật ký làm nghề, sổ tay thiết kế và thử nghiệm AI của Trần Tiểu Ngọc."
      icon: book-open
      children:
        - type: space
          key: space-2
          title: Sổ tay của Ngọc
          path: product-docs
          default: true
          content:
            directory: ./product-docs
            language: vi
