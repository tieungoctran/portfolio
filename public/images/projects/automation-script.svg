<text x="30" y="50" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#7a7a7a">// export-sku.jsx · tái dựng rút gọn</text><text x="30" y="84" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#c8467f">var doc = app.activeDocument;</text><text x="30" y="118" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3a3a3a">if (doc.resolution &lt; 300) {</text><text x="30" y="152" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3a3a3a">  throw new Error("Chưa đủ 300 DPI");</text><text x="30" y="186" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3a3a3a">}</text><text x="30" y="220" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#c8467f">var sku = readSkuFromSheet(doc.name);</text><text x="30" y="254" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3a3a3a">var views = ["FRONT", "BACK", "SIDE", "FLAT"];</text><text x="30" y="288" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3a3a3a">for (var i = 0; i &lt; views.length; i++) {</text><text x="30" y="322" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3a3a3a">  placeOnMockup(doc, views[i]);</text><text x="30" y="356" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3a3a3a">  saveAs(sku + "_" + views[i] + "_300DPI.png");</text><text x="30" y="390" xml:space="preserve" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3a3a3a">}</text></g>
